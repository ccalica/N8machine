# demo.cfg - linker config for demoscene intro
# Single output binary from $0400 to $FFFF (fill=yes).
# CODE+RODATA in PRG, vectors at $FFFA.
# BSS in separate RAM region (not in output file).

MEMORY {
    ZP:     start =   $00, size =  $100, type = rw, define = yes;
    BSSRAM: start = $0200, size =  $0200, type = rw, define = yes;
    PRG:    start = $0400, size = $FC00, file = %O, fill = yes, fillval = $EA;
}

SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp,  optional = yes;
    BSS:      load = BSSRAM, type = bss, optional = yes, define = yes;
    CODE:     load = PRG,    type = ro;
    RODATA:   load = PRG,    type = ro,  optional = yes;
    VECTORS:  load = PRG,    type = ro,  start = $FFFA;
}
